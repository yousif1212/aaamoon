name: Moon TV Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Find Project ZIP
        id: zip
        run: |
          ZIP_FILE=$(find . -path './.git' -prune -o -type f -iname '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Project
        run: |
          mkdir -p "$RUNNER_TEMP/moontv"
          unzip -q "${{ steps.zip.outputs.file }}" -d "$RUNNER_TEMP/moontv"

      - name: Locate Android Project
        id: project
        run: |
          WRAPPER=$(find "$RUNNER_TEMP/moontv" -type f -name gradlew -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: Gradle wrapper not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "Project: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Moon TV APK
        run: |
          cd "${{ steps.project.outputs.dir }}"
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Upload Moon TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Moon-TV-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
